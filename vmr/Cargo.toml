[workspace]
resolver = "3"
members = ["crates/vmr-core", "crates/vmr-utils", "crates/vmr-net", "crates/vmr-pixi", "crates/vmr-lua", "crates/vmr-shell", "crates/vmr-env", "crates/vmr-installer", "crates/vmr-pty", "crates/vmr-cli"]

[workspace.package]
version = "0.8.1"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
indicatif = { git = "https://github.com/dyu/indicatif.git", branch = "legacy" }
itertools = { version = "0.15.0" }
serde = { version = "1", features = ["derive"] }
strum = { version = "0.28.0" }
thiserror = { version = "2.0.21" }
toml = "0.8"
dirs = "6"
regex = "1"

[patch.crates-io]
console = { git = "https://github.com/dyu/console.git", branch = "legacy" }
fs4 = { git = "https://github.com/dyu/fs4.git", branch = "legacy" }
indicatif = { git = "https://github.com/dyu/indicatif.git", branch = "legacy" }
