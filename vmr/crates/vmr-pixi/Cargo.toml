[package]
name = "vmr-pixi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "pixi/rattler-based package backend (solve + install into a vmr prefix)"

[dependencies]
vmr-core = { path = "../vmr-core" }
vmr-net = { path = "../vmr-net" }
vmr-utils = { path = "../vmr-utils" }
indicatif = { workspace = true }
itertools = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { workspace = true }
thiserror = { workspace = true }
url = "2"
zstd = "0.13"

# The solve/install pipeline and conventions are adapted from pixi. Pixi itself is built on
# these rattler crates; using them keeps package resolution, link metadata, noarch handling and
# prefix rewriting consistent with pixi instead of relying on a conda executable.
rattler = { version = "=0.48.1", default-features = false, features = ["rustls", "indicatif"] }
rattler_cache = { version = "0.10.4", default-features = false }
rattler_conda_types = { version = "0.49.0", default-features = false }
rattler_solve = { version = "8.0.0", default-features = false, features = ["resolvo"] }
rattler_virtual_packages = { version = "4.1.0", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
reqwest-middleware = { package = "astral-reqwest-middleware", version = "0.5" }
tokio = { version = "1", features = ["rt-multi-thread"] }
